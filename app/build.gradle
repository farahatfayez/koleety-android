plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.koleety.app'
    compileSdk 36
    defaultConfig {
        applicationId "com.koleety.ai"
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName "1.0.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore/koleety.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "koleety2024"
            keyAlias System.getenv("KEY_ALIAS") ?: "koleety"
            keyPassword System.getenv("KEY_PASSWORD") ?: "koleety2024"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}
dependencies {
    // androidbrowserhelper:2.7.2 - now compatible with compileSdk 36
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    // core-splashscreen required for Theme.SplashScreen in themes.xml
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
