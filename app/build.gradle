plugins {
    id 'com.android.application'
}

def koleetyHomeUrl = (project.findProperty('koleetyHomeUrl') ?: 'https://koleety.com/').toString()
def koleetyTrustedHost = new URI(koleetyHomeUrl).host

android {
    // Keep source/resource package aligned with production; applicationId stays sandbox-only.
    namespace 'com.koleety.ai.app'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Sandbox package so this APK cannot replace any app currently installed from Google Play.
        applicationId 'com.koleety.ai.app.sandbox'
        // Android 5.0+ keeps broad device compatibility while all used APIs remain supported.
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '0.1.0-sandbox'
        buildConfigField 'String', 'KOLEETY_HOME_URL', "\"${koleetyHomeUrl}\""
        buildConfigField 'String', 'KOLEETY_TRUSTED_HOST', "\"${koleetyTrustedHost}\""
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
